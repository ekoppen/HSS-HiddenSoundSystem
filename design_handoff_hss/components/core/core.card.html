<!DOCTYPE html>
<html data-theme="obsidian">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('script[type="text/jsx"]').forEach(function (tag) {
    var code = tag.textContent;
    var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  });
});
</script>
<script src="../../icons.js"></script>
<script src="../../components-bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:24px;}#root{display:flex;flex-direction:column;gap:16px;}</style>
</head>
<body><div id="root"></div>
<script type="text/jsx">
const { Button, IconButton, Badge } = window.SoloistDS;
const { Shuffle, Cast, RefreshCw, Trash2 } = lucide;
function iconEl(I){ return React.createElement(I,{size:14}); }
function App(){
  const [active, setActive] = React.useState(true);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:20}}>
      <div style={{display:'flex', gap:10, flexWrap:'wrap', alignItems:'center'}}>
        <Button variant="primary">Toepassen</Button>
        <Button variant="secondary" icon={<RefreshCw size={14}/>}>Vernieuwen</Button>
        <Button variant="ghost">Annuleren</Button>
        <Button variant="danger" icon={<Trash2 size={14}/>}>Intrekken</Button>
        <Button variant="secondary" size="sm">Compact</Button>
        <Button variant="primary" disabled>Uitgeschakeld</Button>
      </div>
      <div style={{display:'flex', gap:10, alignItems:'center'}}>
        <IconButton icon={<Shuffle size={18}/>} active={active} onClick={()=>setActive(!active)} title="Shuffle" />
        <IconButton icon={<Cast size={18}/>} title="Cast" />
      </div>
      <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
        <Badge variant="success">LIVE</Badge>
        <Badge variant="accent">v2.4</Badge>
        <Badge variant="neutral">24-bit / 96kHz</Badge>
        <Badge variant="warning">SYNCING</Badge>
        <Badge variant="danger">FOUT</Badge>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
