<!DOCTYPE html>
<html data-theme="obsidian">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('script[type="text/jsx"]').forEach(function (tag) {
    var code = tag.textContent;
    var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  });
});
</script>
<script src="../../icons.js"></script>
<script src="../../components-bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:24px;}#root{display:flex;flex-direction:column;gap:16px;}</style>
</head>
<body><div id="root"></div>
<script type="text/jsx">
const { Slider } = window.SoloistDS;
function App(){
  const [vol, setVol] = React.useState(62);
  const [pos, setPos] = React.useState(84000);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:24, maxWidth:420}}>
      <Slider label="Volume" value={vol} onChange={setVol} valueLabel={vol + '%'} />
      <Slider label="Positie" value={pos} max={220000} onChange={setPos} valueLabel="1:24 / 3:40" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
